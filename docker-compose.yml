services:
  db:
    image: postgres:16
    container_name: bouncer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: company
    ports:
      - "5433:5432" # 5433 on the host so it never clashes with a local Postgres on 5432
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
